[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalcascade"
version = "0.1.0"
description = "Production-style evaluation and regression platform for local LLM applications."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "networkx",
    "numpy",
    "scikit-learn",
    "pandas",
    "streamlit",
    "ollama",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
embeddings = ["sentence-transformers"]

[project.scripts]
evalcascade = "evalcascade.cli:main"

[tool.setuptools.packages.find]
include = ["evalcascade*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
# E501 is line length; fixing it would be a style rewrite. E402 is the
# sys.path bootstrap used by the dashboard and one-off scripts.
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
norecursedirs = ["cognitive-eval*", ".git", ".venv", "venv"]
