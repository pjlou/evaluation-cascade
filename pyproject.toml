[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalcascade"
version = "0.1.0"
description = "Production-style evaluation and regression platform for local LLM applications."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "networkx",
    "numpy",
    "scikit-learn",
    "pandas",
    "streamlit",
    "ollama",
]

[project.optional-dependencies]
dev = ["pytest"]
embeddings = ["sentence-transformers"]

[project.scripts]
evalcascade = "evalcascade.cli:main"

[tool.setuptools.packages.find]
include = ["evalcascade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
norecursedirs = ["cognitive-eval*", ".git", ".venv", "venv"]
