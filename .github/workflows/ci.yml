name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and integration tests
        run: pytest
      - name: Smoke evaluation (mock adapter)
        run: python -m evalcascade.run --config configs/ci.yaml --dataset smoke-v1 --adapter mock --fail-on-gate --output eval_runs/smoke.json --store eval_runs/ci.sqlite
      - name: Planted regression must fail gates
        run: python -m pytest tests/test_cli.py::test_planted_regression_fails_gates -q
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: eval_runs/
